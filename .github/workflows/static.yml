name: Build and Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Build the static files
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      # Explicitly set the Node version here to bypass the Node 20 runner defaults
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Downgraded to 18 to fix your Node 20 errors
          cache: 'npm' # Automatically caches your node_modules to speed up builds

      - name: Install dependencies
        run: npm ci # 'npm ci' is safer and faster for automated environments than 'npm install'

      - name: Build the project
        run: npm run build # Runs your build script from package.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # IMPORTANT: Change this to match your framework's output folder!
          # React/Create React App = './build'
          # Vite/Vue/Svelte = './dist'
          # Next.js = './out'
          path: './dist'

  # Job 2: Deploy the built files
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Ensures deploy waits for the build job to finish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
